spring.application.name=fcnami-backend

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:fcnami;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

fcnami.queue.sheet-csv-url=${FCNAMI_QUEUE_SHEET_CSV_URL:https://docs.google.com/spreadsheets/d/1zoRdhy87QEptF0D1zzsfqfrGtd6uAIewkY-HsfeUC_4/export?format=csv&gid=0}
fcnami.queue.cache-ttl-seconds=${FCNAMI_QUEUE_CACHE_TTL_SECONDS:300}

fcnami.youtube.api-key=${YOUTUBE_API_KEY:}
fcnami.youtube.channel-id=${YOUTUBE_CHANNEL_ID:UC8x9Wn-jK6m8l-n3rW-G6Aw}

