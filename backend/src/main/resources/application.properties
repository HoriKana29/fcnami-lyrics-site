spring.application.name=fcnami-backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/fcnami?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

fcnami.queue.sheet-csv-url=${FCNAMI_QUEUE_SHEET_CSV_URL:https://docs.google.com/spreadsheets/d/1zoRdhy87QEptF0D1zzsfqfrGtd6uAIewkY-HsfeUC_4/export?format=csv&gid=0}
fcnami.queue.cache-ttl-seconds=${FCNAMI_QUEUE_CACHE_TTL_SECONDS:300}

fcnami.youtube.api-key=${YOUTUBE_API_KEY:}
fcnami.youtube.channel-id=${YOUTUBE_CHANNEL_ID:}

